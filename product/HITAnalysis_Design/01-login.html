<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HITAnalysis - 登录</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;510;590;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-marketing: #08090a;
      --bg-panel: #0f1011;
      --bg-surface: #191a1b;
      --bg-elevated: #28282c;
      --bg-input: rgba(255,255,255,0.02);
      
      --text-primary: #f7f8f8;
      --text-secondary: #d0d6e0;
      --text-tertiary: #8a8f98;
      --text-muted: #62666d;
      
      --brand-primary: #3B82F6;
      --brand-hover: #2563EB;
      --brand-active: #1D4ED8;
      --brand-light: #60A5FA;
      --brand-subtle: rgba(59,130,246,0.15);
      
      --success: #10B981;
      --warning: #F59E0B;
      --error: #EF4444;
      
      --border-subtle: rgba(255,255,255,0.05);
      --border-standard: rgba(255,255,255,0.08);
      --border-strong: rgba(255,255,255,0.12);
      --border-brand: rgba(59,130,246,0.3);
      
      --ai-gradient-start: #3B82F6;
      --ai-gradient-end: #8B5CF6;
      
      --shadow-elevated: rgba(0,0,0,0.4) 0px 2px 4px;
      --shadow-focus: rgba(0,0,0,0.1) 0px 4px 12px;
      --ai-glow: 0px 0px 20px rgba(59,130,246,0.3), 0px 0px 40px rgba(139,92,246,0.15);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 400;
      background: var(--bg-marketing);
      color: var(--text-secondary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.5;
    }
    
    .login-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 48px;
      padding: 48px;
      max-width: 420px;
      width: 100%;
    }
    
    /* Logo & Brand */
    .brand-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--ai-gradient-start), var(--ai-gradient-end));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--ai-glow);
    }
    
    .logo-icon svg {
      width: 28px;
      height: 28px;
      color: white;
    }
    
    .logo-text {
      font-size: 24px;
      font-weight: 590;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }
    
    .brand-tagline {
      font-size: 15px;
      color: var(--text-tertiary);
      text-align: center;
    }
    
    /* Login Form */
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
      background: var(--bg-panel);
      padding: 32px;
      border-radius: 12px;
      border: 1px solid var(--border-standard);
    }
    
    .form-title {
      font-size: 20px;
      font-weight: 590;
      color: var(--text-primary);
      text-align: center;
    }
    
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .form-label {
      font-size: 13px;
      font-weight: 510;
      color: var(--text-tertiary);
    }
    
    .form-input {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border-standard);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 16px;
      font-family: inherit;
      transition: all 0.2s ease;
    }
    
    .form-input:focus {
      outline: none;
      border-color: var(--border-brand);
      background: rgba(255,255,255,0.04);
      box-shadow: var(--shadow-focus);
    }
    
    .form-input::placeholder {
      color: var(--text-muted);
    }
    
    .form-input-wrapper {
      position: relative;
    }
    
    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }
    
    .input-icon svg {
      width: 16px;
      height: 16px;
    }
    
    .form-input-with-icon {
      padding-left: 40px;
    }
    
    /* Buttons */
    .btn-primary {
      width: 100%;
      padding: 12px 24px;
      background: var(--brand-primary);
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 14px;
      font-weight: 510;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .btn-primary:hover {
      background: var(--brand-hover);
    }
    
    .btn-primary:active {
      background: var(--brand-active);
    }
    
    .btn-primary:focus {
      outline: none;
      box-shadow: var(--shadow-focus), 0 0 0 2px var(--brand-subtle);
    }
    
    /* Org Selector */
    .org-selector {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .org-label {
      font-size: 12px;
      font-weight: 510;
      color: var(--text-tertiary);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .org-dropdown {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .org-dropdown:hover {
      border-color: var(--border-standard);
      background: rgba(255,255,255,0.04);
    }
    
    .org-name {
      font-size: 14px;
      color: var(--text-secondary);
    }
    
    .org-dropdown-icon {
      color: var(--text-muted);
    }
    
    /* Footer Links */
    .login-footer {
      display: flex;
      justify-content: center;
      gap: 24px;
      font-size: 13px;
    }
    
    .login-footer a {
      color: var(--text-tertiary);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    
    .login-footer a:hover {
      color: var(--brand-light);
    }
    
    /* Security Badge */
    .security-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }
    
    .security-badge svg {
      width: 14px;
      height: 14px;
      color: var(--success);
    }
    
    /* Responsive */
    @media (max-width: 480px) {
      .login-container {
        padding: 24px;
        gap: 32px;
      }
      
      .login-form {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <!-- Brand Section -->
    <div class="brand-section">
      <div class="logo">
        <div class="logo-icon">
          <!-- AI Chart Icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3v18h18"/>
            <path d="M18 9l-5 5-4-4-3 3"/>
          </svg>
        </div>
        <span class="logo-text">HITAnalysis</span>
      </div>
      <p class="brand-tagline">医疗数据 AI 智能分析平台 · 数据洞察一目了然</p>
    </div>
    
    <!-- Login Form -->
    <form class="login-form">
      <h1 class="form-title">登录</h1>
      
      <!-- Organization Selector -->
      <div class="org-selector">
        <label class="org-label">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 21h18"/>
            <path d="M5 21V7l7-4 7 4v14"/>
            <path d="M9 21v-4h6v4"/>
          </svg>
          所属机构
        </label>
        <div class="org-dropdown">
          <span class="org-name">XX 医疗集团</span>
          <svg class="org-dropdown-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </div>
      </div>
      
      <!-- Username -->
      <div class="form-group">
        <label class="form-label">用户名</label>
        <div class="form-input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="8" r="4"/>
              <path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
            </svg>
          </span>
          <input type="text" class="form-input form-input-with-icon" placeholder="请输入用户名">
        </div>
      </div>
      
      <!-- Password -->
      <div class="form-group">
        <label class="form-label">密码</label>
        <div class="form-input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input type="password" class="form-input form-input-with-icon" placeholder="请输入密码">
        </div>
      </div>
      
      <!-- Login Button -->
      <button type="submit" class="btn-primary">登录</button>
      
      <!-- Footer Links -->
      <div class="login-footer">
        <a href="#">忘记密码?</a>
        <a href="#">联系管理员</a>
      </div>
    </form>
    
    <!-- Security Badge -->
    <div class="security-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="M9 12l2 2 4-4"/>
      </svg>
      <span>本地部署 · 数据不出院 · 传输加密</span>
    </div>
  </div>
</body>
</html>
