<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HITAnalysis - 权限管理</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;510;590;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-marketing: #08090a; --bg-panel: #0f1011; --bg-surface: #191a1b; --bg-elevated: #28282c;
      --bg-input: rgba(255,255,255,0.02);
      --text-primary: #f7f8f8; --text-secondary: #d0d6e0; --text-tertiary: #8a8f98; --text-muted: #62666d;
      --brand-primary: #3B82F6; --brand-hover: #2563EB; --brand-subtle: rgba(59,130,246,0.15);
      --success: #10B981; --success-subtle: rgba(16,185,129,0.15);
      --warning: #F59E0B; --warning-subtle: rgba(245,158,11,0.15);
      --error: #EF4444; --error-subtle: rgba(239,68,68,0.15);
      --border-subtle: rgba(255,255,255,0.05); --border-standard: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.12);
      --ai-gradient-start: #3B82F6; --ai-gradient-end: #8B5CF6;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg-marketing); color: var(--text-secondary); min-height: 100vh; display: flex; }
    .sidebar { width: 240px; background: var(--bg-panel); border-right: 1px solid var(--border-standard); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .sidebar-header { display: flex; align-items: center; gap: 12px; padding: 12px; margin-bottom: 16px; }
    .logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg,var(--ai-gradient-start),var(--ai-gradient-end)); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .logo-icon svg { width: 18px; height: 18px; color: white; }
    .logo-text { font-size: 16px; font-weight: 510; color: var(--text-primary); }
    .nav-section { margin-bottom: 24px; }
    .nav-section-title { font-size: 11px; font-weight: 510; color: var(--text-muted); padding: 8px 12px; letter-spacing: 0.05em; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 6px; color: var(--text-tertiary); cursor: pointer; transition: all 0.15s; }
    .nav-item:hover { background: var(--bg-input); color: var(--text-secondary); }
    .nav-item.active { background: var(--brand-subtle); color: var(--brand-primary); }
    .nav-item svg { width: 16px; height: 16px; }
    .nav-item-text { font-size: 13px; }
    .main-content { flex: 1; display: flex; flex-direction: column; }
    .topbar { height: 56px; background: var(--bg-panel); border-bottom: 1px solid var(--border-standard); padding: 0 24px; display: flex; align-items: center; justify-content: space-between; }
    .topbar-title { font-size: 16px; font-weight: 590; color: var(--text-primary); }
    .topbar-actions { display: flex; align-items: center; gap: 12px; }
    .content-area { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; }
    .card { background: var(--bg-panel); border: 1px solid var(--border-standard); border-radius: 12px; padding: 20px; }
    .card-title { font-size: 14px; font-weight: 510; color: var(--text-primary); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .btn { padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 510; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s; }
    .btn-secondary { background: var(--bg-input); border: 1px solid var(--border-standard); color: var(--text-secondary); }
    .btn-secondary:hover { background: rgba(255,255,255,0.04); color: var(--text-primary); }
    .btn-primary { background: var(--brand-primary); border: none; color: white; }
    .btn-primary:hover { background: var(--brand-hover); }
    .state-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; font-size: 10px; font-weight: 510; border-radius: 9999px; }
    .state-badge.info { background: var(--brand-subtle); color: var(--brand-primary); }
    .state-badge.success { background: var(--success-subtle); color: var(--success); }
    .state-badge.warning { background: var(--warning-subtle); color: var(--warning); }
    .state-badge.error { background: var(--error-subtle); color: var(--error); }
    .demo-tag { position: fixed; bottom: 16px; right: 16px; padding: 6px 12px; background: var(--bg-elevated); border: 1px solid var(--border-standard); border-radius: 6px; font-size: 11px; color: var(--text-muted); z-index: 100; }
    .filter-section { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .filter-input { padding: 8px 12px; background: var(--bg-input); border: 1px solid var(--border-standard); border-radius: 6px; color: var(--text-primary); font-size: 13px; font-family: 'Inter', sans-serif; width: 200px; }
    .filter-input::placeholder { color: var(--text-muted); }
    .filter-select { padding: 8px 12px; background: var(--bg-input); border: 1px solid var(--border-standard); border-radius: 6px; color: var(--text-secondary); font-size: 13px; font-family: 'Inter', sans-serif; }
    .tabs { display: flex; gap: 4px; margin-bottom: 20px; background: var(--bg-input); padding: 4px; border-radius: 8px; }
    .tab { padding: 8px 16px; font-size: 13px; font-weight: 510; color: var(--text-tertiary); border-radius: 6px; cursor: pointer; transition: all 0.15s; }
    .tab:hover { color: var(--text-secondary); }
    .tab.active { background: var(--bg-surface); color: var(--text-primary); }
    .data-table { background: var(--bg-input); border: 1px solid var(--border-standard); border-radius: 8px; overflow: hidden; }
    .data-table table { width: 100%; border-collapse: collapse; }
    .data-table th { background: rgba(255,255,255,0.03); padding: 10px 16px; font-size: 12px; font-weight: 510; color: var(--text-tertiary); text-align: left; border-bottom: 1px solid var(--border-subtle); }
    .data-table td { padding: 10px 16px; font-size: 13px; color: var(--text-secondary); border-bottom: 1px solid var(--border-subtle); }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: rgba(255,255,255,0.02); }
    .action-btn { padding: 4px 10px; font-size: 11px; border-radius: 4px; cursor: pointer; border: 1px solid var(--border-subtle); background: transparent; color: var(--text-tertiary); transition: all 0.15s; }
    .action-btn:hover { background: var(--bg-elevated); color: var(--text-secondary); }
    .action-btn.edit { color: var(--brand-primary); border-color: rgba(59,130,246,0.3); }
    .action-btn.edit:hover { background: var(--brand-subtle); }
    .action-btn.delete { color: var(--error); border-color: rgba(239,68,68,0.3); }
    .action-btn.delete:hover { background: var(--error-subtle); }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 9l-5 5-4-4-3 3"/></svg></div>
      <span class="logo-text">HITAnalysis</span>
    </div>
    <div class="nav-section">
      <div class="nav-section-title">核心功能</div>
      <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span class="nav-item-text">AI洞察中心</span></div>
      <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 3v18"/></svg><span class="nav-item-text">标准报表中心</span></div>
      <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y2="16"/><line x1="8" y1="16"/><line x1="12" y1="12" x2="12" y2="16"/></svg><span class="nav-item-text">元数据管理</span></div>
      <div class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span class="nav-item-text">权限管理</span></div>
      <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg><span class="nav-item-text">AI操作日志</span></div>
    </div>
    <div class="nav-section">
      <div class="nav-section-title">指标管理</div>
      <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="nav-item-text">指标库</span></div>
      <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span class="nav-item-text">指标分类</span></div>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title">🔐 权限管理</div>
      <div class="topbar-actions">
        <div style="display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--bg-input);border:1px solid var(--border-subtle);border-radius:6px;font-size:13px;color:var(--text-tertiary);cursor:pointer;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/></svg>XX医院 <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div style="width:32px;height:32px;background:var(--brand-subtle);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:510;color:var(--brand-primary);">张</div>
      </div>
    </header>

    <div class="content-area">
      <div class="card">
        <span class="state-badge info" style="margin-bottom:12px">👥 用户权限</span>
        <div class="filter-section">
          <input class="filter-input" placeholder="🔍 搜索用户名...">
          <select class="filter-select"><option>全部角色</option><option>管理员</option><option>主任医师</option><option>医师</option><option>护士</option><option>数据分析师</option></select>
          <select class="filter-select"><option>全部科室</option><option>心内科</option><option>呼吸科</option><option>消化科</option></select>
          <button class="btn btn-primary">+ 添加用户</button>
        </div>

        <div class="tabs">
          <div class="tab active">用户列表</div>
          <div class="tab">角色管理</div>
          <div class="tab">操作审计</div>
        </div>

        <div class="data-table">
          <table>
            <thead>
              <tr><th>用户名</th><th>职位</th><th>科室</th><th>角色</th><th>上次登录</th><th>状态</th><th>操作</th></tr>
            </thead>
            <tbody>
              <tr>
                <td><div style="display:flex;align-items:center;gap:8px;"><div style="width:28px;height:28px;background:var(--brand-subtle);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:510;color:var(--brand-primary);">张</div>张主任</div></td>
                <td>科主任</td><td>心内科</td>
                <td><span class="state-badge success" style="margin:0">管理员</span></td>
                <td>2026-05-09 08:12</td>
                <td><span class="state-badge success" style="margin:0">● 在线</span></td>
                <td><button class="action-btn edit">编辑</button> <button class="action-btn delete">禁用</button></td>
              </tr>
              <tr>
                <td><div style="display:flex;align-items:center;gap:8px;"><div style="width:28px;height:28px;background:var(--warning-subtle);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:510;color:var(--warning);">李</div>李医生</div></td>
                <td>主治医师</td><td>呼吸科</td>
                <td><span class="state-badge info" style="margin:0">医师</span></td>
                <td>2026-05-08 17:45</td>
                <td><span class="state-badge warning" style="margin:0">● 离线</span></td>
                <td><button class="action-btn edit">编辑</button> <button class="action-btn delete">禁用</button></td>
              </tr>
              <tr>
                <td><div style="display:flex;align-items:center;gap:8px;"><div style="width:28px;height:28px;background:var(--success-subtle);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:510;color:var(--success);">王</div>王护士长</div></td>
                <td>护士长</td><td>消化科</td>
                <td><span class="state-badge info" style="margin:0">护士</span></td>
                <td>2026-05-09 07:30</td>
                <td><span class="state-badge success" style="margin:0">● 在线</span></td>
                <td><button class="action-btn edit">编辑</button> <button class="action-btn delete">禁用</button></td>
              </tr>
              <tr>
                <td><div style="display:flex;align-items:center;gap:8px;"><div style="width:28px;height:28px;background:var(--brand-subtle);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:510;color:var(--brand-primary);">赵</div>赵分析师</div></td>
                <td>数据分析师</td><td>信息科</td>
                <td><span class="state-badge success" style="margin:0">管理员</span></td>
                <td>2026-05-08 19:20</td>
                <td><span class="state-badge warning" style="margin:0">● 离线</span></td>
                <td><button class="action-btn edit">编辑</button> <button class="action-btn delete">禁用</button></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <div class="demo-tag">🆕 HLD v2.0 - 权限管理</div>
</body>
</html>
