<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HITAnalysis - 权限管理</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;510;590;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-marketing: #08090a;
      --bg-panel: #0f1011;
      --bg-surface: #191a1b;
      --bg-elevated: #28282c;
      --bg-input: rgba(255,255,255,0.02);
      
      --text-primary: #f7f8f8;
      --text-secondary: #d0d6e0;
      --text-tertiary: #8a8f98;
      --text-muted: #62666d;
      
      --brand-primary: #3B82F6;
      --brand-hover: #2563EB;
      --brand-subtle: rgba(59,130,246,0.15);
      
      --success: #10B981;
      --warning: #F59E0B;
      --error: #EF4444;
      
      --border-subtle: rgba(255,255,255,0.05);
      --border-standard: rgba(255,255,255,0.08);
      --border-strong: rgba(255,255,255,0.12);
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 400;
      background: var(--bg-marketing);
      color: var(--text-secondary);
      min-height: 100vh;
      line-height: 1.5;
    }
    
    /* Layout */
    .app-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      grid-template-rows: 56px 1fr;
      min-height: 100vh;
    }
    
    /* Top Bar */
    .top-bar {
      grid-column: 1 / -1;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-subtle);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px;
    }
    
    .top-bar-left { display: flex; align-items: center; gap: 24px; }
    
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #3B82F6, #8B5CF6);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-icon svg { width: 18px; height: 18px; color: white; }
    .logo-text { font-size: 16px; font-weight: 590; color: var(--text-primary); }
    
    .nav-tabs { display: flex; gap: 8px; }
    .nav-tab {
      padding: 8px 16px; font-size: 13px; font-weight: 510;
      color: var(--text-tertiary); border-radius: 6px; cursor: pointer;
      transition: all 0.2s;
    }
    .nav-tab:hover { color: var(--text-secondary); background: var(--bg-input); }
    .nav-tab.active { color: var(--brand-primary); background: var(--brand-subtle); }
    
    .top-bar-right { display: flex; align-items: center; gap: 16px; }
    .user-avatar {
      width: 32px; height: 32px; background: var(--brand-subtle);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 510; color: var(--brand-primary);
    }
    
    /* Sidebar */
    .sidebar {
      background: var(--bg-panel);
      border-right: 1px solid var(--border-subtle);
      padding: 16px; overflow-y: auto;
    }
    
    .sidebar-title {
      font-size: 12px; font-weight: 510; color: var(--text-muted);
      margin-bottom: 12px;
    }
    
    .sidebar-nav { display: flex; flex-direction: column; gap: 4px; }
    
    .sidebar-item {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px; font-size: 13px;
      color: var(--text-tertiary); border-radius: 6px; cursor: pointer;
      transition: all 0.2s;
    }
    .sidebar-item:hover { background: var(--bg-input); color: var(--text-secondary); }
    .sidebar-item.active { background: var(--brand-subtle); color: var(--brand-primary); }
    
    .sidebar-icon { font-size: 14px; }
    
    /* Main Content */
    .main-content {
      background: var(--bg-marketing);
      padding: 24px; overflow-y: auto;
    }
    
    /* Two Column Layout */
    .content-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 24px; height: calc(100vh - 104px);
    }
    
    /* Panel */
    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border-standard);
      border-radius: 12px; padding: 20px;
      display: flex; flex-direction: column;
    }
    
    .panel-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px;
    }
    
    .panel-title {
      font-size: 16px; font-weight: 510; color: var(--text-secondary);
    }
    
    .panel-actions { display: flex; gap: 8px; }
    
    /* Tree Structure */
    .org-tree {
      background: var(--bg-input);
      border: 1px solid var(--border-standard);
      border-radius: 8px; padding: 16px;
      overflow-y: auto; flex: 1;
    }
    
    .tree-node {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; font-size: 13px;
      color: var(--text-tertiary); border-radius: 6px;
      cursor: pointer; transition: all 0.2s;
      margin-left: 0;
    }
    
    .tree-node:hover { background: rgba(255,255,255,0.03); color: var(--text-secondary); }
    .tree-node.selected { background: var(--brand-subtle); color: var(--brand-primary); }
    
    .tree-node.level-1 { margin-left: 0; }
    .tree-node.level-2 { margin-left: 20px; font-size: 12px; }
    .tree-node.level-3 { margin-left: 40px; font-size: 11px; }
    
    .tree-toggle {
      width: 16px; height: 16px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted);
    }
    
    .tree-toggle svg { width: 10px; height: 10px; }
    
    .tree-icon { font-size: 12px; }
    
    /* User List */
    .user-list {
      background: var(--bg-input);
      border: 1px solid var(--border-standard);
      border-radius: 8px; overflow-y: auto; flex: 1;
    }
    
    .user-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-subtle);
      transition: all 0.2s;
    }
    
    .user-item:last-child { border-bottom: none; }
    .user-item:hover { background: rgba(255,255,255,0.02); }
    .user-item.selected { background: var(--brand-subtle); }
    
    .user-info {
      display: flex; align-items: center; gap: 12px;
    }
    
    .user-avatar-sm {
      width: 28px; height: 28px;
      background: var(--bg-elevated); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 510; color: var(--text-tertiary);
    }
    
    .user-name {
      font-size: 14px; color: var(--text-secondary);
    }
    
    .user-role {
      font-size: 12px; color: var(--text-muted);
    }
    
    .user-actions {
      display: flex; gap: 8px;
    }
    
    .action-btn {
      padding: 6px 12px;
      font-size: 12px; font-weight: 510;
      color: var(--text-tertiary);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .action-btn:hover { background: var(--bg-elevated); color: var(--text-secondary); }
    
    /* Permission Matrix */
    .permission-section {
      margin-top: 24px;
    }
    
    .permission-title {
      font-size: 14px; font-weight: 510; color: var(--text-secondary);
      margin-bottom: 16px;
    }
    
    .permission-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    
    .permission-card {
      background: var(--bg-input);
      border: 1px solid var(--border-standard);
      border-radius: 8px; padding: 16px;
    }
    
    .permission-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 12px;
    }
    
    .permission-icon {
      font-size: 16px;
    }
    
    .permission-name {
      font-size: 13px; font-weight: 510; color: var(--text-secondary);
    }
    
    .permission-toggle {
      display: flex; align-items: center; gap: 8px;
    }
    
    .toggle-switch {
      width: 44px; height: 24px;
      background: var(--bg-elevated);
      border-radius: 12px;
      position: relative;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .toggle-switch.on { background: var(--success); }
    
    .toggle-knob {
      width: 18px; height: 18px;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: 3px; left: 3px;
      transition: all 0.2s;
    }
    
    .toggle-switch.on .toggle-knob { left: 23px; }
    
    .toggle-label {
      font-size: 12px; color: var(--text-muted);
    }
    
    /* Buttons */
    .btn-primary {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 16px; background: var(--brand-primary);
      border: none; border-radius: 6px;
      color: white; font-size: 14px; font-weight: 510;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-primary:hover { background: var(--brand-hover); }
    
    .btn-secondary {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 16px; background: var(--bg-input);
      border: 1px solid var(--border-standard); border-radius: 6px;
      color: var(--text-secondary); font-size: 14px; font-weight: 510;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.04); color: var(--text-primary); }
    
    /* AI Permission Section */
    .ai-permission-card {
      background: rgba(59,130,246,0.05);
      border: 1px solid rgba(59,130,246,0.2);
      border-radius: 8px; padding: 16px;
    }
    
    .ai-permission-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 12px;
    }
    
    .ai-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 8px;
      font-size: 11px; font-weight: 510;
      background: var(--brand-subtle); color: var(--brand-primary);
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="top-bar-left">
        <div class="logo">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 3v18h18"/><path d="M18 9l-5 5-4-4-3 3"/>
            </svg>
          </div>
          <span class="logo-text">HITAnalysis</span>
        </div>
        <nav class="nav-tabs">
          <div class="nav-tab">AI 洞察中心</div>
          <div class="nav-tab">标准报表中心</div>
          <div class="nav-tab">元数据管理</div>
          <div class="nav-tab active">权限管理</div>
        </nav>
      </div>
      <div class="top-bar-right">
        <div class="user-avatar">李</div>
      </div>
    </header>
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-title">权限管理</div>
      <div class="sidebar-nav">
        <div class="sidebar-item active">
          <span class="sidebar-icon">🏢</span>
          多机构管理
        </div>
        <div class="sidebar-item">
          <span class="sidebar-icon">👥</span>
          用户与角色
        </div>
        <div class="sidebar-item">
          <span class="sidebar-icon">🔐</span>
          权限配置
        </div>
        <div class="sidebar-item">
          <span class="sidebar-icon">⏰</span>
          临时授权
        </div>
      </div>
    </aside>
    
    <!-- Main Content -->
    <main class="main-content">
      <!-- Two Column Grid -->
      <div class="content-grid">
        <!-- Left Panel: Org Tree -->
        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">组织架构</div>
            <div class="panel-actions">
              <button class="btn-secondary">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                新增机构
              </button>
            </div>
          </div>
          
          <div class="org-tree">
            <!-- Level 1 -->
            <div class="tree-node level-1 selected">
              <div class="tree-toggle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M6 9l6 6 6-6"/>
                </svg>
              </div>
              <span class="tree-icon">🏥</span>
              XX医疗集团
            </div>
            
            <!-- Level 2 -->
            <div class="tree-node level-2">
              <div class="tree-toggle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M6 9l6 6 6-6"/>
                </svg>
              </div>
              <span class="tree-icon">🏥</span>
              XX院区A
            </div>
            
            <!-- Level 3 -->
            <div class="tree-node level-3">
              <span class="tree-icon">📁</span>
              内科
            </div>
            <div class="tree-node level-3">
              <span class="tree-icon">📁</span>
              外科
            </div>
            
            <!-- Level 2 -->
            <div class="tree-node level-2">
              <div class="tree-toggle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M9 18l6-6-6-6"/>
                </svg>
              </div>
              <span class="tree-icon">🏥</span>
              XX院区B
            </div>
          </div>
        </div>
        
        <!-- Right Panel: User List -->
        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">用户列表（XX院区A）</div>
            <div class="panel-actions">
              <button class="btn-secondary">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                新增用户
              </button>
            </div>
          </div>
          
          <div class="user-list">
            <div class="user-item selected">
              <div class="user-info">
                <div class="user-avatar-sm">张</div>
                <div>
                  <div class="user-name">张主任</div>
                  <div class="user-role">医务科主任</div>
                </div>
              </div>
              <div class="user-actions">
                <button class="action-btn">编辑</button>
              </div>
            </div>
            
            <div class="user-item">
              <div class="user-info">
                <div class="user-avatar-sm">王</div>
                <div>
                  <div class="user-name">王医生</div>
                  <div class="user-role">心内科主任</div>
                </div>
              </div>
              <div class="user-actions">
                <button class="action-btn">编辑</button>
              </div>
            </div>
            
            <div class="user-item">
              <div class="user-info">
                <div class="user-avatar-sm">李</div>
                <div>
                  <div class="user-name">李工程师</div>
                  <div class="user-role">数据工程师</div>
                </div>
              </div>
              <div class="user-actions">
                <button class="action-btn">编辑</button>
              </div>
            </div>
            
            <div class="user-item">
              <div class="user-info">
                <div class="user-avatar-sm">赵</div>
                <div>
                  <div class="user-name">赵院长</div>
                  <div class="user-role">院长</div>
                </div>
              </div>
              <div class="user-actions">
                <button class="action-btn">编辑</button>
              </div>
            </div>
          </div>
          
          <!-- Permission Section -->
          <div class="permission-section">
            <div class="permission-title">张主任 的权限配置</div>
            
            <!-- Data Permission -->
            <div class="permission-grid">
              <div class="permission-card">
                <div class="permission-header">
                  <span class="permission-icon">📊</span>
                  <span class="permission-name">数据权限</span>
                </div>
                <div class="permission-toggle">
                  <div class="toggle-switch on">
                    <div class="toggle-knob"></div>
                  </div>
                  <span class="toggle-label">仅院区</span>
                </div>
              </div>
              
              <div class="permission-card">
                <div class="permission-header">
                  <span class="permission-icon">📁</span>
                  <span class="permission-name">菜单权限</span>
                </div>
                <div class="permission-toggle">
                  <div class="toggle-switch on">
                    <div class="toggle-knob"></div>
                  </div>
                  <span class="toggle-label">全菜单</span>
                </div>
              </div>
              
              <div class="permission-card">
                <div class="permission-header">
                  <span class="permission-icon">🔘</span>
                  <span class="permission-name">按钮权限</span>
                </div>
                <div class="permission-toggle">
                  <div class="toggle-switch on">
                    <div class="toggle-knob"></div>
                  </div>
                  <span class="toggle-label">导出/保存</span>
                </div>
              </div>
              
              <!-- AI Permission (special) -->
              <div class="ai-permission-card">
                <div class="ai-permission-header">
                  <span class="permission-icon">🤖</span>
                  <span class="permission-name">AI 权限</span>
                  <span class="ai-badge">AI功能</span>
                </div>
                <div class="permission-toggle">
                  <div class="toggle-switch on">
                    <div class="toggle-knob"></div>
                  </div>
                  <span class="toggle-label">已启用</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
