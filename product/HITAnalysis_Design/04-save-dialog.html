<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HITAnalysis - 保存报表</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;510;590;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-marketing: #08090a; --bg-panel: #0f1011; --bg-surface: #191a1b; --bg-elevated: #28282c;
      --bg-input: rgba(255,255,255,0.02);
      --text-primary: #f7f8f8; --text-secondary: #d0d6e0; --text-tertiary: #8a8f98; --text-muted: #62666d;
      --brand-primary: #3B82F6; --brand-hover: #2563EB; --brand-subtle: rgba(59,130,246,0.15);
      --success: #10B981; --warning: #F59E0B; --error: #EF4444;
      --border-subtle: rgba(255,255,255,0.05); --border-standard: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.12);
      --ai-gradient-start: #3B82F6; --ai-gradient-end: #8B5CF6;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: rgba(0,0,0,0.6); display: flex;
      align-items: center; justify-content: center;
      min-height: 100vh; color: var(--text-secondary);
    }
    .dialog {
      background: var(--bg-panel);
      border: 1px solid var(--border-standard);
      border-radius: 16px;
      padding: 32px;
      width: 480px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .dialog-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px;
    }
    .dialog-title { font-size: 18px; font-weight: 590; color: var(--text-primary); }
    .dialog-close { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer; color: var(--text-tertiary); }
    .dialog-close:hover { background: var(--bg-input); color: var(--text-secondary); }
    .field { margin-bottom: 20px; }
    .field-label { font-size: 13px; font-weight: 510; color: var(--text-secondary); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .field-input { width: 100%; padding: 10px 14px; background: var(--bg-input); border: 1px solid var(--border-standard); border-radius: 8px; color: var(--text-primary); font-size: 14px; font-family: 'Inter', sans-serif; }
    .field-input:focus { outline: none; border-color: var(--brand-primary); }
    .field-input::placeholder { color: var(--text-muted); }
    .field-select { width: 100%; padding: 10px 14px; background: var(--bg-input); border: 1px solid var(--border-standard); border-radius: 8px; color: var(--text-secondary); font-size: 14px; font-family: 'Inter', sans-serif; cursor: pointer; }
    .field-textarea { width: 100%; padding: 10px 14px; background: var(--bg-input); border: 1px solid var(--border-standard); border-radius: 8px; color: var(--text-primary); font-size: 14px; font-family: 'Inter', sans-serif; resize: vertical; min-height: 80px; }
    .field-textarea:focus { outline: none; border-color: var(--brand-primary); }
    .radio-group { display: flex; gap: 16px; }
    .radio-item { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: var(--text-secondary); }
    .radio-dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border-strong); display: flex; align-items: center; justify-content: center; }
    .radio-dot.active { border-color: var(--brand-primary); }
    .radio-dot.active::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--brand-primary); }
    .checkbox-item { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: var(--text-secondary); }
    .checkbox-box { width: 18px; height: 18px; border: 2px solid var(--border-strong); border-radius: 4px; display: flex; align-items: center; justify-content: center; }
    .checkbox-box.active { border-color: var(--brand-primary); background: var(--brand-primary); }
    .checkbox-box.active::after { content: '✓'; color: white; font-size: 12px; font-weight: 700; }
    .dialog-footer { display: flex; justify-content: flex-end; gap: 12px; margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border-standard); }
    .btn { padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 510; cursor: pointer; transition: all 0.2s; }
    .btn-primary { background: var(--brand-primary); border: none; color: white; }
    .btn-primary:hover { background: var(--brand-hover); }
    .btn-secondary { background: var(--bg-input); border: 1px solid var(--border-standard); color: var(--text-secondary); }
    .btn-secondary:hover { background: rgba(255,255,255,0.04); color: var(--text-primary); }
    .demo-tag { position: fixed; bottom: 16px; right: 16px; padding: 6px 12px; background: var(--bg-elevated); border: 1px solid var(--border-standard); border-radius: 6px; font-size: 11px; color: var(--text-muted); z-index: 100; }
    .state-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; font-size: 10px; font-weight: 510; border-radius: 9999px; margin-bottom: 16px; }
    .state-badge.info { background: var(--brand-subtle); color: var(--brand-primary); }
  </style>
</head>
<body>
  <div class="dialog">
    <div class="dialog-header">
      <div>
        <span class="state-badge info">💾 保存</span>
        <div class="dialog-title">保存报表</div>
      </div>
      <div class="dialog-close">✕</div>
    </div>

    <div class="field">
      <div class="field-label">📄 报表名称</div>
      <input class="field-input" value="门诊运营日报 - 2026年Q2" placeholder="输入报表名称">
    </div>

    <div class="field">
      <div class="field-label">📁 保存位置</div>
      <select class="field-select">
        <option>我的报表</option>
        <option>日常监测</option>
        <option>月度汇报</option>
        <option>未分类</option>
      </select>
    </div>

    <div class="field">
      <div class="field-label">🔁 自动刷新</div>
      <div class="radio-group">
        <label class="radio-item">
          <div class="radio-dot active"></div>
          每日
        </label>
        <label class="radio-item">
          <div class="radio-dot"></div>
          每周
        </label>
        <label class="radio-item">
          <div class="radio-dot"></div>
          手动
        </label>
      </div>
    </div>

    <div class="field">
      <div class="field-label">📝 备注描述</div>
      <textarea class="field-textarea" placeholder="可选：添加备注说明..."></textarea>
    </div>

    <div class="field">
      <label class="checkbox-item">
        <div class="checkbox-box active"></div>
        包含AI洞察结论
      </label>
      <label class="checkbox-item" style="margin-top:8px;">
        <div class="checkbox-box"></div>
        设为默认首页
      </label>
    </div>

    <div class="dialog-footer">
      <button class="btn btn-secondary">取消</button>
      <button class="btn btn-primary">💾 保存报表</button>
    </div>
  </div>
  <div class="demo-tag">🆕 HLD v2.0 - 保存报表对话框</div>
</body>
</html>
